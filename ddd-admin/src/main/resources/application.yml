# ========================================
# DDD Admin — 企业级后台管理系统 配置文件
# ========================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ddd-admin
  profiles:
    active: dev

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/ddd?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:                # Redis 密码，无密码则留空
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  # Jackson 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  # 实体类扫描
  type-aliases-package: com.ddd.admin.entity
  # XML 映射文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # SQL 日志（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存
    cache-enabled: true
  global-config:
    db-config:
      # 主键类型：自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: isDeleted
      logic-delete-value: 1     # 已删除
      logic-not-delete-value: 0 # 未删除
      # 字段填充策略
      insert-strategy: not_null
      update-strategy: not_null

# JWT 配置
jwt:
  # 密钥（生产环境请使用复杂密钥）
  secret: DDD-Admin-Secret-Key-2026-Please-Change-In-Production-MinLength-256Bit
  # Token 过期时间（秒）: 2小时
  expire: 7200
  # Refresh Token 过期时间（秒）: 7天
  refresh-expire: 604800
  # Token 请求头名称
  header: Authorization
  # Token 前缀
  token-prefix: Bearer

# Shiro 配置
shiro:
  # 启用注解支持
  annotation-enabled: true
  # 登录相关
  login:
    # 登录失败最大次数
    max-fail-count: 5
    # 登录失败锁定时间（秒）
    lock-time: 900
    # 验证码过期时间（秒）
    captcha-expire: 300

# 日志配置
logging:
  level:
    root: INFO
    com.ddd.admin: DEBUG
    org.apache.shiro: INFO
